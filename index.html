<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bundelkhand FM Application</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --paper: #eef1e2;
        --ink: #1d2116;
        --ink-soft: #676f56;
        --signal: #f2b400;
        --signal-deep: #c98f00;
        --mist: #b9c0cf;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--paper);
        background: #0d0f14;
      }

      /* photo credit: Pixabay (cdn.pixabay.com), free to use */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(
            180deg,
            rgba(9, 10, 14, 0.78) 0%,
            rgba(9, 10, 14, 0.55) 45%,
            rgba(9, 10, 14, 0.88) 100%
          ),
          url("./images/index.png") center 62% / cover no-repeat;
      }

      .display {
        font-family: "Khand", sans-serif;
        font-weight: 600;
      }

      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 1160px;
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr;
        align-items: center;
        gap: 44px;
        padding: 56px 24px;
      }

      @media (min-width: 980px) {
        main {
          grid-template-columns: 1fr 380px;
        }
      }

      .hero {
        display: none;
      }

      @media (min-width: 980px) {
        .hero {
          display: block;
        }
      }

      .headline {
        font-size: clamp(48px, 6vw, 84px);
        line-height: 0.96;
        margin: 0 0 20px;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
      }

      .lede {
        max-width: 40ch;
        font-size: 15.5px;
        line-height: 1.75;
        color: #d7dbcd;
      }

      .route-line {
        margin-top: 30px;
        font-size: 13px;
        color: var(--mist);
        letter-spacing: 0.02em;
      }

      .route-line b {
        color: var(--paper);
        font-weight: 500;
      }

      /* ---------- ticket ---------- */

      .ticket-shell {
        justify-self: center;
        width: 100%;
        max-width: 380px;
        animation: stamp 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
      }

      @keyframes stamp {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ticket-shell {
          animation: none;
        }
      }

      .ticket {
        background: var(--paper);
        color: var(--ink);
        border-radius: 4px;
        box-shadow:
          0 40px 80px -24px rgba(0, 0, 0, 0.6),
          0 2px 0 rgba(255, 255, 255, 0.5) inset;
        position: relative;
        overflow: hidden;
      }

      .ticket::after {
        /* perforated closing edge */
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background-image: radial-gradient(
          circle,
          #0d0f14 3.5px,
          transparent 4px
        );
        background-size: 16px 8px;
        background-position: -8px 0;
        opacity: 0.9;
      }

      .ticket-top {
        padding: 32px 30px 26px;
      }

      .ticket-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .ticket-kicker {
        font-size: 11.5px;
        color: var(--ink-soft);
      }

      .ticket-title {
        font-size: 28px;
        margin: 5px 0 0;
      }

      .ticket-code {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
      }

      .passenger {
        margin-top: 26px;
        padding-top: 22px;
        border-top: 1px solid #d4dab9;
      }

      .passenger-label {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .passenger-name {
        font-size: 34px;
        margin: 5px 0 2px;
      }

      .passenger-age {
        font-size: 13px;
        color: var(--ink-soft);
      }

      .shuffle {
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: none;
        padding: 0;
        font-family: "Inter", sans-serif;
        font-size: 12.5px;
        color: var(--signal-deep);
        cursor: pointer;
      }

      .shuffle svg {
        transition: transform 0.4s ease;
      }

      .shuffle:hover svg {
        transform: rotate(180deg);
      }

      button.go {
        margin-top: 28px;
        width: 100%;
        background: var(--ink);
        color: var(--paper);
        border: none;
        border-radius: 3px;
        padding: 15px;
        font-family: "Khand", sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }

      button.go:hover {
        background: #33392a;
      }

      button.go:active {
        transform: scale(0.99);
      }

      button.go:focus-visible,
      .shuffle:focus-visible {
        outline: 2px solid var(--signal-deep);
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <main>
      <section class="hero">
        <h1 class="headline display">Bundelkhand FM</h1>
        <p class="lede">
          Every ride gets a ticket, a passenger, and Bundelkhand's highway
          songs. This one's headed from Jhansi to Banda, by way of Mahoba.
        </p>
        <p class="route-line"><b>Uttar Pradesh</b> — <b>Madhya Pradesh</b></p>
      </section>

      <div class="ticket-shell">
        <div class="ticket">
          <div class="ticket-top">
            <div class="ticket-head">
              <div>
                <div class="ticket-kicker">Passenger ticket</div>
                <h2 class="ticket-title display">Bundelkhand Travels</h2>
              </div>
              <div class="ticket-code mono">BKD·FM</div>
            </div>

            <div class="passenger">
              <div class="passenger-label">Passenger</div>
              <div class="passenger-name display" id="pname">—</div>
              <div class="passenger-age" id="page">—</div>
              <button class="shuffle" onclick="rollPassenger()" type="button">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Shuffle passenger
              </button>
            </div>

            <button class="go" onclick="startJourney()">Start journey</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const NAMES = ["Arjun", "Kabir", "Ananya", "Diya"];

      let passenger = { name: "", age: 0 };

      function rollPassenger() {
        const name = NAMES[Math.floor(Math.random() * NAMES.length)];
        const age = 23 + Math.floor(Math.random() * 3); // 23–25
        passenger = { name, age };
        document.getElementById("pname").textContent = name;
        document.getElementById("page").textContent = age + " years old";
      }

      function startJourney() {
        localStorage.setItem("bundelkhandPassenger", JSON.stringify(passenger));
        window.location.href = "journey.html";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") startJourney();
      });

      rollPassenger();
    </script>
  </body>
</html>
