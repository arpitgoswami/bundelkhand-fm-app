<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bundelkhand FM Application</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/97fba59076.js"
      crossorigin="anonymous"
    ></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Khand", "sans-serif"],
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: {
              paper: "#eef1e2",
              ink: "#1d2116",
              muted: "#676f56",
              signal: "#f2b400",
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-[#0d0f14] font-sans text-paper">
    <div
      class="fixed inset-0 -z-10 bg-cover bg-center"
      style="
        background:
          linear-gradient(rgba(9, 10, 14, 0.65), rgba(9, 10, 14, 0.75)),
          url(&quot;./images/index.png&quot;) center / cover no-repeat;
      "
    ></div>

    <main
      class="mx-auto flex min-h-screen w-full max-w-6xl items-center px-5 py-10 sm:px-8 lg:px-10"
    >
      <div
        class="grid w-full items-center gap-12 lg:grid-cols-[1fr_390px] lg:gap-20"
      >
        <section class="hidden lg:block">
          <div class="mb-7 flex items-center gap-3">
            <i class="fa-solid fa-grip-lines text-[#f2b400]"></i>

            <span
              class="font-mono text-[10px] uppercase tracking-[0.22em] text-[#b9c0cf]"
            >
              BKD · FM
            </span>
          </div>

          <h1
            class="max-w-2xl font-display text-[clamp(64px,7vw,94px)] font-semibold leading-[0.86] tracking-[-0.02em] text-[#eef1e2]"
          >
            Bundelkhand
            <span class="block text-[#f2b400]">FM</span>
          </h1>

          <p class="mt-8 max-w-lg text-[15px] leading-7 text-[#d7dbcd]/80">
            Every ride has a passenger, a route, and a collection of songs made
            for the Bundelkhand highway.
          </p>

          <div class="mt-10 flex items-center gap-4">
            <div
              class="uppercase text-xs font-mono tracking-widest text-[#b9c0cf] rounded-full border border-white/10 bg-black/20 px-4 py-2 backdrop-blur-sm"
            >
              Uttar Pradesh
            </div>

            <i class="fa-solid fa-arrows-left-right text-[#f2b400] text-xs"></i>

            <div
              class="uppercase text-xs font-mono tracking-widest text-[#b9c0cf] rounded-full border border-white/10 bg-black/20 px-4 py-2 backdrop-blur-sm"
            >
              Madhya Pradesh
            </div>
          </div>
        </section>

        <div class="w-full">
          <div class="mb-6 lg:hidden">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-grip-lines text-[#f2b400]"></i>

              <span
                class="font-mono text-[10px] uppercase tracking-[0.22em] text-[#b9c0cf]"
              >
                BKD · FM
              </span>
            </div>

            <h1 class="mt-3 font-display text-5xl font-semibold leading-none">
              Bundelkhand <span class="text-[#f2b400]">FM</span>
            </h1>
          </div>

          <div class="relative mx-auto w-full max-w-[390px]">
            <div
              class="absolute -inset-3 rounded-xl bg-black/30 blur-2xl"
            ></div>

            <div
              class="relative overflow-hidden rounded-[6px] bg-[#eef1e2] text-[#1d2116] shadow-[0_35px_80px_rgba(0,0,0,0.55)]"
            >
              <div class="px-7 pb-8 pt-7 sm:px-8">
                <div class="flex items-start justify-between">
                  <div>
                    <p
                      class="text-[10px] font-medium uppercase tracking-[0.16em] text-[#676f56]"
                    >
                      Passenger ticket
                    </p>

                    <h2
                      class="mt-1 font-display text-[30px] font-semibold leading-none"
                    >
                      Bundelkhand Travels
                    </h2>
                  </div>

                  <div
                    class="rounded-sm border border-[#d4dab9] px-2 py-1 font-mono text-[9px] tracking-widest text-[#676f56]"
                  >
                    BKD·FM
                  </div>
                </div>

                <div class="my-7 h-px bg-[#d4dab9]"></div>

                <div>
                  <p
                    class="text-[10px] uppercase tracking-[0.16em] text-[#676f56]"
                  >
                    Passenger
                  </p>

                  <div
                    id="pname"
                    class="mt-1 font-display text-[46px] font-semibold leading-none"
                  >
                    —
                  </div>

                  <div id="page" class="mt-1 text-xs text-[#676f56]">—</div>

                  <button
                    onclick="rollPassenger()"
                    type="button"
                    class="group mt-4 inline-flex items-center gap-2 text-xs font-medium text-[#c98f00] transition hover:text-[#1d2116]"
                  >
                    <i
                      class="fa-solid fa-arrow-rotate-right transition duration-500 group-hover:rotate-180"
                    ></i>

                    Shuffle passenger
                  </button>
                </div>

                <div
                  class="mt-7 grid grid-cols-2 border-y border-[#d4dab9] py-4"
                >
                  <div>
                    <p
                      class="text-[9px] uppercase tracking-[0.15em] text-[#676f56]"
                    >
                      Route
                    </p>

                    <p class="mt-1 font-display text-lg font-semibold">
                      Jalaun
                      <i class="fa-solid fa-arrow-right-long text-xs"></i>
                      Sagar
                    </p>
                  </div>

                  <div class="border-l border-[#d4dab9] pl-4">
                    <p
                      class="text-[9px] uppercase tracking-[0.15em] text-[#676f56]"
                    >
                      Via
                    </p>

                    <p class="mt-1 font-display text-lg font-semibold">
                      Mahoba
                    </p>
                  </div>
                </div>

                <button
                  onclick="startJourney()"
                  type="button"
                  class="group mt-7 flex w-full items-center justify-between rounded-[4px] bg-[#1d2116] px-5 py-4 text-[#eef1e2] transition duration-200 hover:bg-[#303728] active:scale-[0.99]"
                >
                  <span class="font-display text-xl font-semibold">
                    Start journey
                  </span>

                  <i
                    class="fa-solid fa-circle-arrow-right text-[#f2b400] w-8 h-8 transition-transform duration-200 group-hover:translate-x-1"
                  ></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const NAMES = ["Arjun", "Kabir", "Ananya", "Diya"];

      let passenger = {
        name: "",
        age: 0,
      };

      function rollPassenger() {
        const name = NAMES[Math.floor(Math.random() * NAMES.length)];

        const age = 23 + Math.floor(Math.random() * 3);

        passenger = {
          name,
          age,
        };

        document.getElementById("pname").textContent = name;

        document.getElementById("page").textContent = age + " years old";
      }

      function startJourney() {
        localStorage.setItem("bundelkhandPassenger", JSON.stringify(passenger));

        window.location.href = "journey.html";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          startJourney();
        }
      });

      rollPassenger();
    </script>
  </body>
</html>
