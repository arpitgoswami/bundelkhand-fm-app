<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bundelkhand FM</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Khand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background: #0d0f14;
        color: #eef1e2;
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #backgroundVideo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        transition: opacity 0.7s ease;
      }

      #scene::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: linear-gradient(
          180deg,
          rgba(7, 8, 10, 0.28) 0%,
          rgba(7, 8, 10, 0.08) 38%,
          rgba(7, 8, 10, 0.42) 100%
        );
      }

      .player {
        position: relative;
        overflow: hidden;
        background: rgba(5, 6, 7, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.58),
          0 8px 24px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.035);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .player::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(242, 180, 0, 0.75);
      }

      .progress-track {
        position: relative;
        height: 2px;
        width: 100%;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        cursor: pointer;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: #f2b400;
        transition: width 0.1s linear;
      }

      .control-btn {
        transition:
          transform 0.2s ease,
          opacity 0.2s ease,
          background 0.2s ease;
      }

      .control-btn:hover {
        opacity: 1;
        transform: translateY(-1px);
      }

      .play-btn {
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .play-btn:hover {
        transform: scale(1.04);
      }

      .modal-backdrop {
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .modal-card {
        background: rgba(8, 9, 10, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.65);
      }

      .track-item {
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }

      .track-item:hover {
        background: rgba(255, 255, 255, 0.055);
      }

      .rain-drop {
        position: absolute;
        top: -40px;
        width: 1px;
        height: 30px;
        background: rgba(220, 235, 255, 0.18);
        transform: rotate(12deg);
        animation: rain linear infinite;
        pointer-events: none;
      }

      @keyframes rain {
        from {
          transform: translate3d(0, -60px, 0) rotate(12deg);
        }

        to {
          transform: translate3d(-120px, 110vh, 0) rotate(12deg);
        }
      }

      .fade-in {
        animation: fadeIn 0.8s ease both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 767px) {
        #scene::after {
          background: linear-gradient(
            180deg,
            rgba(7, 8, 10, 0.3) 0%,
            rgba(7, 8, 10, 0.12) 35%,
            rgba(7, 8, 10, 0.55) 100%
          );
        }
      }
    </style>
  </head>

  <body>
    <main id="scene">
      <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>

      <header
        class="absolute left-5 right-5 top-5 z-30 flex items-start justify-between sm:left-8 sm:right-8 sm:top-7 lg:left-10 lg:right-10"
      >
        <div class="fade-in">
          <div class="flex items-center gap-3">
            <span class="h-px w-8 bg-[#f2b400]"></span>

            <span
              class="font-['JetBrains_Mono'] text-[8px] tracking-[.22em] text-[#eef1e2]/60 sm:text-[9px]"
            >
              BKD · FM
            </span>
          </div>

          <div
            class="mt-1.5 font-['Khand'] text-[30px] font-semibold leading-none sm:text-[36px]"
          >
            Bundelkhand <span class="text-[#f2b400]">FM</span>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
          <button
            id="rainBtn"
            class="rounded-full border border-white/15 bg-black/35 px-3 py-1.5 font-['JetBrains_Mono'] text-[8px] tracking-[.12em] text-[#eef1e2]/75 backdrop-blur-md transition hover:bg-black/55 hover:text-white sm:px-4 sm:py-2 sm:text-[9px]"
          >
            Rain
          </button>

          <button
            id="modeBtn"
            class="rounded-full border border-white/15 bg-black/35 px-3 py-1.5 font-['JetBrains_Mono'] text-[8px] tracking-[.12em] text-[#eef1e2]/75 backdrop-blur-md transition hover:bg-black/55 hover:text-white sm:px-4 sm:py-2 sm:text-[9px]"
          >
            Day
          </button>
        </div>
      </header>

      <div
        id="playerWrap"
        class="absolute left-1/2 top-[27vh] z-20 w-[calc(100%-40px)] max-w-[900px] -translate-x-1/2 sm:w-[calc(100%-80px)] lg:top-[29vh]"
      >
        <section class="player rounded-[20px] px-4 py-3 sm:px-5 sm:py-4">
          <div
            class="relative z-10 flex flex-col gap-3 lg:flex-row lg:items-center lg:gap-5"
          >
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-4">
                <div class="min-w-0">
                  <div
                    id="trackTitle"
                    class="truncate font-['Khand'] text-[18px] font-medium leading-none text-[#eef1e2] sm:text-[21px]"
                  >
                    Select a track
                  </div>

                  <div
                    id="trackArtist"
                    class="mt-1 truncate font-['JetBrains_Mono'] text-[7px] tracking-[.16em] text-[#eef1e2]/45 sm:text-[8px]"
                  >
                    BUNDELKHAND FM
                  </div>
                </div>

                <div class="hidden shrink-0 text-right lg:block">
                  <div
                    id="routeText"
                    class="font-['Khand'] text-[14px] font-medium leading-none text-[#eef1e2]/80"
                  >
                    Jalaun → Sagar
                  </div>

                  <div
                    class="mt-1 font-['JetBrains_Mono'] text-[7px] tracking-[.16em] text-[#eef1e2]/35"
                  >
                    VIA MAHOBA
                  </div>
                </div>
              </div>

              <div class="mt-3 flex items-center gap-3">
                <span
                  id="currentTime"
                  class="w-7 shrink-0 font-['JetBrains_Mono'] text-[7px] text-[#eef1e2]/40"
                >
                  0:00
                </span>

                <div id="progressTrack" class="progress-track">
                  <div id="progressFill" class="progress-fill"></div>
                </div>

                <span
                  id="duration"
                  class="w-7 shrink-0 text-right font-['JetBrains_Mono'] text-[7px] text-[#eef1e2]/40"
                >
                  0:00
                </span>
              </div>
            </div>

            <div class="flex items-center justify-between gap-3 lg:justify-end">
              <div class="flex items-center gap-3">
                <button
                  id="prevBtn"
                  class="control-btn font-['JetBrains_Mono'] text-[7px] tracking-[.12em] text-[#eef1e2]/40 hover:text-[#eef1e2]/80"
                >
                  PREV
                </button>

                <button
                  id="playBtn"
                  class="play-btn flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#f2b400] text-[#11130d] shadow-lg shadow-black/30"
                  aria-label="Play"
                >
                  <svg
                    id="playIcon"
                    width="13"
                    height="13"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 3.9 8 4.4 8 5.2Z"
                    />
                  </svg>
                </button>

                <button
                  id="nextBtn"
                  class="control-btn font-['JetBrains_Mono'] text-[7px] tracking-[.12em] text-[#eef1e2]/40 hover:text-[#eef1e2]/80"
                >
                  NEXT
                </button>
              </div>

              <button
                id="chooseBtn"
                class="rounded-full border border-white/12 bg-white/[0.035] px-3 py-2 font-['JetBrains_Mono'] text-[7px] tracking-[.1em] text-[#eef1e2]/55 transition hover:bg-white/[0.07] hover:text-[#eef1e2]/90"
              >
                CHOOSE TRACK
              </button>
            </div>
          </div>

          <div class="mt-3 flex items-center justify-between lg:hidden">
            <div
              class="font-['Khand'] text-[13px] font-medium text-[#eef1e2]/70"
            >
              Jalaun → Sagar
            </div>

            <div
              class="font-['JetBrains_Mono'] text-[6px] tracking-[.15em] text-[#eef1e2]/35"
            >
              VIA MAHOBA
            </div>
          </div>
        </section>
      </div>

      <div
        id="rain"
        class="pointer-events-none absolute inset-0 z-10 hidden overflow-hidden"
      ></div>

      <div
        id="trackModal"
        class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center px-5"
      >
        <div class="modal-card w-full max-w-[520px] rounded-[22px] p-5 sm:p-6">
          <div class="flex items-center justify-between">
            <div>
              <div
                class="font-['JetBrains_Mono'] text-[7px] tracking-[.2em] text-[#f2b400]"
              >
                BUNDELKHAND FM
              </div>

              <h2
                class="mt-1 font-['Khand'] text-[27px] font-medium leading-none"
              >
                Choose a track
              </h2>
            </div>

            <button
              id="closeModal"
              class="rounded-full border border-white/10 px-3 py-1.5 font-['JetBrains_Mono'] text-[7px] tracking-[.12em] text-[#eef1e2]/55 transition hover:bg-white/5 hover:text-white"
            >
              CLOSE
            </button>
          </div>

          <div class="mt-5">
            <div class="relative">
              <svg
                class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30"
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>

              <input
                id="searchInput"
                type="text"
                placeholder="Search track..."
                class="w-full rounded-xl border border-white/10 bg-white/[0.035] py-3 pl-9 pr-4 font-['JetBrains_Mono'] text-[9px] text-white outline-none placeholder:text-white/25 focus:border-[#f2b400]/40"
              />
            </div>
          </div>

          <div
            id="trackList"
            class="mt-4 max-h-[300px] space-y-1 overflow-y-auto pr-1"
          ></div>
        </div>
      </div>
    </main>

    <script>
      const TRACKS = [
        {
          title: "Aaye Ho Meri Zindagi Mein",
          artist: "Alka Yagnik · Raja Hindustani",
          file: "music/Aaye Ho Meri Zindagi Mein ALKA YAGNIK Raja Hindustani 1996.mp3",
        },
        {
          title: "Pehla Nasha Pehla Khumar",
          artist: "Udit Narayan · Sadhana Sargam",
          file: "music/Pehla Nasha Pehla khumar Full HD I Udit Narayan,Sadhana sargam I Jo Jeeta wohi sikandar.mp3",
        },
      ];

      const BG = {
        day: "./background/day.mp4",
        night: "./background/night.mp4",
      };

      const scene = document.getElementById("scene");
      const backgroundVideo = document.getElementById("backgroundVideo");

      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const chooseBtn = document.getElementById("chooseBtn");

      const rainBtn = document.getElementById("rainBtn");
      const modeBtn = document.getElementById("modeBtn");

      const trackTitle = document.getElementById("trackTitle");
      const trackArtist = document.getElementById("trackArtist");

      const currentTime = document.getElementById("currentTime");
      const duration = document.getElementById("duration");

      const progressTrack = document.getElementById("progressTrack");
      const progressFill = document.getElementById("progressFill");

      const trackModal = document.getElementById("trackModal");
      const closeModal = document.getElementById("closeModal");

      const searchInput = document.getElementById("searchInput");
      const trackList = document.getElementById("trackList");

      const rain = document.getElementById("rain");

      let currentIndex = 0;
      let isPlaying = false;
      let mode = "night";
      let rainEnabled = false;

      const audio = new Audio();
      audio.preload = "metadata";

      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) {
          return "0:00";
        }

        const minutes = Math.floor(seconds / 60);

        const secs = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");

        return `${minutes}:${secs}`;
      }

      function updatePlayIcon() {
        if (isPlaying) {
          playIcon.innerHTML = `
          <rect x="7" y="5" width="3.5" height="14" rx="1"></rect>
          <rect x="13.5" y="5" width="3.5" height="14" rx="1"></rect>
        `;
        } else {
          playIcon.innerHTML = `
          <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 3.9 8 4.4 8 5.2Z"/>
        `;
        }
      }

      function loadTrack(index, autoplay = false) {
        currentIndex = (index + TRACKS.length) % TRACKS.length;

        const track = TRACKS[currentIndex];

        trackTitle.textContent = track.title;
        trackArtist.textContent = track.artist;

        audio.src = track.file;
        audio.load();

        currentTime.textContent = "0:00";
        duration.textContent = "0:00";
        progressFill.style.width = "0%";

        if (autoplay) {
          audio
            .play()
            .then(() => {
              isPlaying = true;
              updatePlayIcon();
            })
            .catch(() => {
              isPlaying = false;
              updatePlayIcon();
            });
        } else {
          isPlaying = false;
          updatePlayIcon();
        }
      }

      function togglePlay() {
        if (!audio.src) {
          loadTrack(currentIndex, true);
          return;
        }

        if (audio.paused) {
          audio
            .play()
            .then(() => {
              isPlaying = true;
              updatePlayIcon();
            })
            .catch(() => {});
        } else {
          audio.pause();
          isPlaying = false;
          updatePlayIcon();
        }
      }

      function nextTrack() {
        loadTrack(currentIndex + 1, true);
      }

      function previousTrack() {
        loadTrack(currentIndex - 1, true);
      }

      function renderTracks(query = "") {
        const value = query.trim().toLowerCase();

        const filtered = TRACKS.map((track, index) => ({
          ...track,
          index,
        })).filter((track) =>
          `${track.title} ${track.artist}`.toLowerCase().includes(value),
        );

        if (!filtered.length) {
          trackList.innerHTML = `
          <div class="py-8 text-center font-['JetBrains_Mono'] text-[8px] tracking-[.1em] text-white/30">
            NO TRACK FOUND
          </div>
        `;

          return;
        }

        trackList.innerHTML = filtered
          .map(
            (track) => `
        <button
          data-index="${track.index}"
          class="track-item flex w-full items-center justify-between gap-4 rounded-xl border border-transparent px-3 py-3 text-left"
        >
          <div class="min-w-0">

            <div class="truncate font-['Khand'] text-[17px] leading-none text-[#eef1e2]/90">
              ${track.title}
            </div>

            <div class="mt-1 truncate font-['JetBrains_Mono'] text-[6px] tracking-[.12em] text-white/30">
              ${track.artist}
            </div>

          </div>

          <span class="shrink-0 font-['JetBrains_Mono'] text-[6px] tracking-[.1em] text-[#f2b400]/70">
            PLAY
          </span>

        </button>
      `,
          )
          .join("");

        trackList.querySelectorAll("[data-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const index = Number(button.dataset.index);

            loadTrack(index, true);
            closeTrackModal();
          });
        });
      }

      function openTrackModal() {
        renderTracks(searchInput.value);

        trackModal.classList.remove("hidden");
        trackModal.classList.add("flex");

        setTimeout(() => {
          searchInput.focus();
        }, 50);
      }

      function closeTrackModal() {
        trackModal.classList.add("hidden");
        trackModal.classList.remove("flex");
        searchInput.value = "";
      }

      function setMode(nextMode) {
        mode = nextMode;

        backgroundVideo.style.opacity = "0";

        setTimeout(() => {
          backgroundVideo.src = BG[mode];
          backgroundVideo.load();

          backgroundVideo.play().catch(() => {});

          backgroundVideo.style.opacity = "1";
        }, 300);

        modeBtn.textContent = mode === "night" ? "Day" : "Night";
      }

      function createRain() {
        rain.innerHTML = "";

        const amount = window.innerWidth < 768 ? 80 : 150;

        for (let i = 0; i < amount; i++) {
          const drop = document.createElement("span");

          drop.className = "rain-drop";
          drop.style.left = `${Math.random() * 110}%`;
          drop.style.animationDuration = `${0.45 + Math.random() * 0.7}s`;
          drop.style.animationDelay = `${Math.random() * 1.5}s`;
          drop.style.opacity = `${0.12 + Math.random() * 0.25}`;
          drop.style.height = `${18 + Math.random() * 22}px`;

          rain.appendChild(drop);
        }
      }

      function toggleRain() {
        rainEnabled = !rainEnabled;

        if (rainEnabled) {
          createRain();

          rain.classList.remove("hidden");

          rainBtn.textContent = "Rain On";
        } else {
          rain.classList.add("hidden");

          rainBtn.textContent = "Rain";
        }
      }

      playBtn.addEventListener("click", togglePlay);

      nextBtn.addEventListener("click", nextTrack);

      prevBtn.addEventListener("click", previousTrack);

      chooseBtn.addEventListener("click", openTrackModal);

      closeModal.addEventListener("click", closeTrackModal);

      rainBtn.addEventListener("click", toggleRain);

      modeBtn.addEventListener("click", () => {
        setMode(mode === "night" ? "day" : "night");
      });

      searchInput.addEventListener("input", () => {
        renderTracks(searchInput.value);
      });

      trackModal.addEventListener("click", (event) => {
        if (event.target === trackModal) {
          closeTrackModal();
        }
      });

      progressTrack.addEventListener("click", (event) => {
        if (!audio.duration) {
          return;
        }

        const rect = progressTrack.getBoundingClientRect();

        const percent = (event.clientX - rect.left) / rect.width;

        audio.currentTime = percent * audio.duration;
      });

      audio.addEventListener("loadedmetadata", () => {
        duration.textContent = formatTime(audio.duration);
      });

      audio.addEventListener("timeupdate", () => {
        currentTime.textContent = formatTime(audio.currentTime);

        if (audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;

          progressFill.style.width = `${percent}%`;
        }
      });

      audio.addEventListener("play", () => {
        isPlaying = true;
        updatePlayIcon();
      });

      audio.addEventListener("pause", () => {
        isPlaying = false;
        updatePlayIcon();
      });

      audio.addEventListener("ended", () => {
        nextTrack();
      });

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" && event.target.tagName !== "INPUT") {
          event.preventDefault();
          togglePlay();
        }

        if (event.code === "Escape") {
          closeTrackModal();
        }

        if (event.code === "ArrowRight") {
          nextTrack();
        }

        if (event.code === "ArrowLeft") {
          previousTrack();
        }
      });

      backgroundVideo.src = BG.night;
      backgroundVideo.play().catch(() => {});

      loadTrack(0, false);
      renderTracks();
    </script>
  </body>
</html>
