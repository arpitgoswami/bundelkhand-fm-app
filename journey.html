<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bundelkhand FM Application</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="./favicon.ico" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Khand", "sans-serif"],
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: {
              paper: "#eef1e2",
              ink: "#1d2116",
              muted: "#676f56",
              signal: "#f2b400",
            },
            keyframes: {
              rain: {
                from: { transform: "translate3d(0,-60px,0) rotate(12deg)" },
                to: { transform: "translate3d(-120px,110vh,0) rotate(12deg)" },
              },
              fadeIn: {
                from: { opacity: 0, transform: "translateY(8px)" },
                to: { opacity: 1, transform: "translateY(0)" },
              },
            },
            animation: {
              rain: "rain linear infinite",
              fadeIn: "fadeIn .8s ease both",
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Khand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/97fba59076.js"
      crossorigin="anonymous"
    ></script>

    <style>
      *{box-sizing:border-box}
      html,body{margin:0;width:100%;height:100%;overflow:hidden}
      #backgroundVideo{transition:opacity:.7s ease}
      #scene::after{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:1;
        background:linear-gradient(
          180deg,
          rgba(7,8,10,.28) 0%,
          rgba(7,8,10,.08) 38%,
          rgba(7,8,10,.42) 100%
        )
      }
      .player{
        background:rgba(5,6,7,.85);
        border:1px solid rgba(255,255,255,.08);
        box-shadow:0 24px 70px rgba(0,0,0,.58),0 8px 24px rgba(0,0,0,.28);
        backdrop-filter:blur(24px);
        -webkit-backdrop-filter:blur(24px)
      }
      .progress-area{
        position:relative;
        height:12px;
        display:flex;
        align-items:center;
        width:100%;
        cursor:pointer
      }
      .progress-track{
        position:relative;
        height:3px;
        width:100%;
        overflow:hidden;
        border-radius:999px;
        background:rgba(255,255,255,.15);
        transition:height .2s ease
      }
      .progress-area:hover .progress-track,
      .progress-area:active .progress-track{height:5px}
      .progress-fill{
        height:100%;
        width:0;
        border-radius:999px;
        background:#f2b400
      }
      .modal-card{
        background:rgba(8,9,10,.97);
        border:1px solid rgba(255,255,255,.12);
        box-shadow:0 30px 100px rgba(0,0,0,.65);
        transform:translateY(15px) scale(.98);
        transition:transform .3s cubic-bezier(.175,.885,.32,1.275)
      }
      .modal-backdrop{
        background:rgba(0,0,0,.7);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        opacity:0;
        visibility:hidden;
        transition:opacity .3s ease,visibility .3s ease
      }
      .modal-backdrop.is-open{
        opacity:1;
        visibility:visible
      }
      .modal-backdrop.is-open .modal-card{
        transform:translateY(0) scale(1)
      }
      .track-item{transition:background .2s ease,border-color .2s ease}
      .track-item:hover,.track-item:focus{
        background:rgba(255,255,255,.055);
        outline:none
      }
      .track-item.active{
        background:rgba(242,180,0,.1);
        border-color:rgba(242,180,0,.3)
      }
      .rain-drop{
        position:absolute;
        top:-40px;
        width:1px;
        background:rgba(220,235,255,.18);
        transform:rotate(12deg);
        pointer-events:none
      }
      ::-webkit-scrollbar{width:6px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{
        background:rgba(255,255,255,.15);
        border-radius:10px
      }
      ::-webkit-scrollbar-thumb:hover{
        background:rgba(255,255,255,.25)
      }
    </style>
  </head>

  <body
    class="h-screen w-full overflow-hidden bg-[#0d0f14] font-sans text-paper"
  >
    <main id="scene" class="relative h-full w-full overflow-hidden">
      <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        class="absolute inset-0 z-0 h-full w-full object-cover"
      ></video>

      <header
        class="absolute left-6 right-6 top-6 z-30 flex items-start justify-between sm:left-10 sm:right-10 sm:top-10"
      >
        <div class="animate-fadeIn">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-grip-lines text-signal"></i>

            <span
              class="font-mono text-[8px] tracking-[.22em] text-paper/60 sm:text-[9px]"
            >
              BKD · FM
            </span>
          </div>

          <div
            class="mt-1.5 font-display text-[30px] font-semibold leading-none sm:text-[36px]"
          >
            Bundelkhand <span class="text-signal">FM</span>
          </div>
        </div>

        <div class="flex items-center gap-3 sm:gap-4">
          <button
            id="rainBtn"
            class="rounded border border-white/20 bg-black/45 px-3 py-2 font-mono text-[8px] tracking-[.12em] text-paper/80 backdrop-blur-md transition hover:border-white/40 hover:bg-black/60 sm:px-4 sm:py-2.5 sm:text-[9px]"
          >
            <i class="fa-solid fa-cloud-rain mr-1"></i>
            Rain
          </button>

          <button
            id="modeBtn"
            class="rounded border border-white/20 bg-black/45 px-3 py-2 font-mono text-[8px] tracking-[.12em] text-paper/80 backdrop-blur-md transition hover:border-white/40 hover:bg-black/60 sm:px-4 sm:py-2.5 sm:text-[9px]"
          >
            <i class="fa-solid fa-sun mr-1"></i>
            Day
          </button>
        </div>
      </header>

      <div
        class="rounded absolute left-1/2 top-[20vh] z-20 w-[calc(100%-40px)] max-w-[1000px] -translate-x-1/2 sm:w-[calc(100%-80px)]"
      >
        <section
          class="player flex flex-col gap-6 rounded p-5 sm:p-6 lg:flex-row lg:items-center lg:gap-8"
        >
          <div class="min-w-0 flex-1">
            <div
              id="trackTitle"
              class="truncate font-display text-[22px] font-medium leading-none text-white sm:text-[26px]"
            >
              Select a track
            </div>

            <div
              id="trackArtist"
              class="mt-2 truncate font-mono text-[9px] tracking-widest text-white/50"
            >
              BUNDELKHAND FM
            </div>

            <div class="mt-5 flex items-center gap-4">
              <span
                id="currentTime"
                class="w-8 shrink-0 font-mono text-[10px] text-white/70"
              >
                0:00
              </span>

              <div id="progressArea" class="progress-area">
                <div id="progressTrack" class="progress-track">
                  <div id="progressFill" class="progress-fill"></div>
                </div>
              </div>

              <span
                id="duration"
                class="w-8 shrink-0 text-right font-mono text-[10px] text-white/70"
              >
                0:00
              </span>
            </div>
          </div>

          <div class="hidden shrink-0 items-center gap-8 lg:flex">
            <div class="h-14 w-px bg-white/10"></div>

            <div>
              <p class="font-display text-lg font-semibold">
                Jalaun
                <i class="fa-solid fa-arrow-right-long mx-1 text-xs"></i>
                Sagar
              </p>

              <div
                class="mt-1.5 font-mono text-[8px] tracking-[.2em] text-white/40"
              >
                VIA MAHOBA
              </div>
            </div>

            <div class="ml-2 flex items-center gap-6">
              <button
                id="prevBtn"
                aria-label="Previous Track"
                class="text-white/50 transition hover:text-signal"
              >
                <i class="fa-solid fa-backward-step"></i>
              </button>

              <button
                id="playBtn"
                aria-label="Play/Pause"
                class="transition hover:scale-105"
              >
                <i
                  id="playIcon"
                  class="fa-solid fa-circle-play text-[2.4rem] text-signal"
                ></i>
              </button>

              <button
                id="nextBtn"
                aria-label="Next Track"
                class="text-white/50 transition hover:text-signal"
              >
                <i class="fa-solid fa-forward-step"></i>
              </button>
            </div>

            <div class="h-14 w-px bg-white/10"></div>

            <button
              id="chooseBtn"
              class="rounded border border-white/20 px-5 py-2.5 font-mono text-[9px] tracking-[.15em] text-white transition hover:bg-white/5"
            >
              CHOOSE TRACK
            </button>
          </div>

          <div
            class="flex items-center justify-between border-t border-white/10 pt-4 lg:hidden"
          >
            <div class="flex items-center gap-6">
              <button
                id="prevBtnMob"
                aria-label="Previous Track"
                class="text-white/50 transition hover:text-signal"
              >
                <i class="fa-solid fa-backward-step"></i>
              </button>

              <button
                id="playBtnMob"
                aria-label="Play/Pause"
                class="transition hover:scale-105"
              >
                <i
                  id="playIconMob"
                  class="fa-solid fa-circle-play text-[2.4rem] text-signal"
                ></i>
              </button>

              <button
                id="nextBtnMob"
                aria-label="Next Track"
                class="text-white/50 transition hover:text-signal"
              >
                <i class="fa-solid fa-forward-step"></i>
              </button>
            </div>

            <button
              id="chooseBtnMob"
              class="border border-white/20 px-3 py-1.5 font-mono text-[8px] tracking-widest text-white"
            >
              TRACKS
            </button>
          </div>
        </section>
      </div>

      <footer
        class="pointer-events-none absolute bottom-6 left-6 right-6 z-30 sm:bottom-10 sm:left-10 sm:right-10"
      >
        <div class="flex items-center gap-4">
          <i class="fa-solid fa-grip-lines text-signal"></i>

          <div
            class="font-mono text-[9px] leading-relaxed tracking-[.25em] text-white/60"
          >
            <span class="block">MUSIC MAKES</span>
            <span class="block">JOURNEYS BETTER</span>
          </div>
        </div>
      </footer>

      <div
        id="rain"
        class="pointer-events-none absolute inset-0 z-10 hidden overflow-hidden"
      ></div>

      <div
        id="trackModal"
        class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center px-5"
      >
        <div
          class="modal-card w-full max-w-[520px] rounded p-5 sm:p-6"
          role="dialog"
          aria-modal="true"
        >
          <div class="flex items-center justify-between">
            <div>
              <h2
                class="mt-1 font-display text-[27px] font-medium leading-none"
              >
                Choose a track
              </h2>
            </div>

            <button
              id="closeModal"
              aria-label="Close"
              class="text-white/60 transition hover:text-white"
            >
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
          </div>

          <div class="relative mt-5">
            <i
              class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-white/30"
            ></i>

            <input
              id="searchInput"
              type="text"
              placeholder="Search track..."
              class="w-full rounded border border-white/10 bg-white/[.035] py-3 pl-9 pr-4 font-mono text-[10px] text-white outline-none placeholder:text-white/30 focus:border-signal/60"
            />
          </div>

          <div
            id="trackList"
            class="mt-4 max-h-[300px] space-y-1 overflow-y-auto pr-2 pb-1"
          ></div>
        </div>
      </div>
    </main>

    <script>
      const TRACKS = [
        {
          title: "Aaye Ho Meri Zindagi Mein",
          artist: "Alka Yagnik · Raja Hindustani",
          file: "music/Aaye Ho Meri Zindagi Mein ALKA YAGNIK Raja Hindustani 1996.mp3",
        },
        {
          title: "Pehla Nasha Pehla Khumar",
          artist: "Udit Narayan · Sadhana Sargam",
          file: "music/Pehla Nasha Pehla khumar Full HD I Udit Narayan,Sadhana sargam I Jo Jeeta wohi sikandar.mp3",
        },
      ];

      const BG = {
        day: "./background/day.mp4",
        night: "./background/night.mp4",
      };

      const $ = (id) => document.getElementById(id);

      const DOM = {
        video: $("backgroundVideo"),
        playBtns: [$("playBtn"), $("playBtnMob")],
        prevBtns: [$("prevBtn"), $("prevBtnMob")],
        nextBtns: [$("nextBtn"), $("nextBtnMob")],
        chooseBtns: [$("chooseBtn"), $("chooseBtnMob")],
        rainBtn: $("rainBtn"),
        modeBtn: $("modeBtn"),
        title: $("trackTitle"),
        artist: $("trackArtist"),
        current: $("currentTime"),
        duration: $("duration"),
        progress: $("progressArea"),
        fill: $("progressFill"),
        modal: $("trackModal"),
        close: $("closeModal"),
        search: $("searchInput"),
        list: $("trackList"),
        rain: $("rain"),
      };

      const audio = new Audio();
      audio.preload = "metadata";

      let currentIndex = 0;
      let mode = "night";
      let rainEnabled = false;
      let dragging = false;

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
      };

      function updatePlayIcon() {
        DOM.playBtns.forEach((btn) => {
          if (!btn) return;
          btn.innerHTML = audio.paused
            ? '<i class="fa-solid fa-circle-play text-[2.4rem] text-signal"></i>'
            : '<i class="fa-solid fa-circle-pause text-[2.4rem] text-signal"></i>';
        });
      }

      function loadTrack(index, autoplay = false) {
        currentIndex = (index + TRACKS.length) % TRACKS.length;
        const track = TRACKS[currentIndex];

        DOM.title.textContent = track.title;
        DOM.artist.textContent = track.artist;

        audio.pause();
        audio.src = encodeURI(track.file);
        audio.load();

        DOM.current.textContent = "0:00";
        DOM.duration.textContent = "0:00";
        DOM.fill.style.width = "0%";

        renderTracks(DOM.search.value);
        updatePlayIcon();

        if (autoplay) {
          audio
            .play()
            .then(updatePlayIcon)
            .catch((error) => {
              console.error("Audio playback failed:", error);
              console.error("File:", track.file);
              updatePlayIcon();
            });
        }
      }

      function togglePlay() {
        if (!audio.src) {
          loadTrack(currentIndex, true);
          return;
        }

        if (audio.paused) {
          audio
            .play()
            .then(updatePlayIcon)
            .catch((error) => {
              console.error("Playback failed:", error);
              updatePlayIcon();
            });
        } else {
          audio.pause();
          updatePlayIcon();
        }
      }

      function renderTracks(query = "") {
        const value = query.trim().toLowerCase();

        const tracks = TRACKS.map((track, index) => ({
          ...track,
          index,
        })).filter((track) =>
          `${track.title} ${track.artist}`.toLowerCase().includes(value),
        );

        if (!tracks.length) {
          DOM.list.innerHTML = `
      <div class="py-8 text-center font-mono text-[8px] tracking-[.1em] text-white/30">
        NO TRACK FOUND
      </div>
    `;
          return;
        }

        DOM.list.innerHTML = tracks
          .map((track) => {
            const active = track.index === currentIndex;

            return `
      <button
        data-index="${track.index}"
        class="track-item flex w-full items-center justify-between gap-4 rounded border px-3 py-3 text-left ${
          active ? "border-signal/30 bg-signal/10" : "border-transparent"
        }"
      >
        <div class="min-w-0">
          <div class="truncate font-display text-[17px] leading-none ${
            active ? "text-signal" : "text-white"
          }">
            ${track.title}
          </div>
          <div class="mt-1 truncate font-mono text-[8px] tracking-widest ${
            active ? "text-signal/70" : "text-white/40"
          }">
            ${track.artist}
          </div>
        </div>
      </button>
    `;
          })
          .join("");
      }

      function openModal() {
        renderTracks(DOM.search.value);
        DOM.modal.classList.remove("opacity-0", "invisible");
        DOM.modal.classList.add("opacity-100", "visible");
        setTimeout(() => DOM.search.focus(), 100);
      }

      function closeModal() {
        DOM.modal.classList.remove("opacity-100", "visible");
        DOM.modal.classList.add("opacity-0", "invisible");
        DOM.search.value = "";
      }

      function setMode(next) {
        mode = next;
        DOM.video.classList.add("opacity-0");

        setTimeout(() => {
          DOM.video.src = BG[mode];
          DOM.video.load();
          DOM.video.play().catch(() => {});
          DOM.video.classList.remove("opacity-0");
        }, 300);

        DOM.modeBtn.innerHTML =
          mode === "night"
            ? '<i class="fa-solid fa-sun mr-1"></i> Day'
            : '<i class="fa-solid fa-moon mr-1"></i> Night';
      }

      function createRain() {
        DOM.rain.innerHTML = "";
        const amount = innerWidth < 768 ? 80 : 150;
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < amount; i++) {
          const drop = document.createElement("span");
          drop.className =
            "absolute top-[-40px] pointer-events-none w-px bg-[rgba(220,235,255,.18)] rotate-[12deg] animate-rain";
          drop.style.left = `${Math.random() * 110}%`;
          drop.style.animationDuration = `${0.45 + Math.random() * 0.7}s`;
          drop.style.animationDelay = `${Math.random() * 1.5}s`;
          drop.style.opacity = `${0.12 + Math.random() * 0.25}`;
          drop.style.height = `${18 + Math.random() * 22}px`;
          fragment.appendChild(drop);
        }

        DOM.rain.appendChild(fragment);
      }

      function toggleRain() {
        rainEnabled = !rainEnabled;

        if (rainEnabled) {
          createRain();
          DOM.rain.classList.remove("hidden");
          DOM.rainBtn.classList.add(
            "border-signal/50",
            "bg-signal/15",
            "text-signal",
          );
        } else {
          DOM.rain.classList.add("hidden");
          DOM.rainBtn.classList.remove(
            "border-signal/50",
            "bg-signal/15",
            "text-signal",
          );
        }
      }

      function updateProgress(e) {
        if (!audio.duration) return;

        const rect = DOM.progress.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const percent = Math.max(0, Math.min(1, x / rect.width));

        DOM.fill.style.width = `${percent * 100}%`;

        if (dragging) audio.currentTime = percent * audio.duration;
      }

      DOM.playBtns.forEach((btn) => {
        if (btn) btn.addEventListener("click", togglePlay);
      });

      DOM.nextBtns.forEach((btn) => {
        if (btn)
          btn.addEventListener("click", () =>
            loadTrack(currentIndex + 1, true),
          );
      });

      DOM.prevBtns.forEach((btn) => {
        if (btn)
          btn.addEventListener("click", () =>
            loadTrack(currentIndex - 1, true),
          );
      });

      DOM.chooseBtns.forEach((btn) => {
        if (btn) btn.addEventListener("click", openModal);
      });

      DOM.close.addEventListener("click", closeModal);
      DOM.rainBtn.addEventListener("click", toggleRain);

      DOM.modeBtn.addEventListener("click", () => {
        setMode(mode === "night" ? "day" : "night");
      });

      DOM.search.addEventListener("input", () => {
        renderTracks(DOM.search.value);
      });

      DOM.list.addEventListener("click", (e) => {
        const button = e.target.closest("[data-index]");
        if (!button) return;
        loadTrack(Number(button.dataset.index), true);
        closeModal();
      });

      DOM.modal.addEventListener("click", (e) => {
        if (e.target === DOM.modal) closeModal();
      });

      DOM.progress.addEventListener("pointerdown", (e) => {
        dragging = true;
        DOM.progress.setPointerCapture(e.pointerId);
        updateProgress(e);
      });

      DOM.progress.addEventListener("pointermove", (e) => {
        if (dragging) updateProgress(e);
      });

      DOM.progress.addEventListener("pointerup", (e) => {
        dragging = false;
        updateProgress(e);
      });

      DOM.progress.addEventListener("pointercancel", () => {
        dragging = false;
      });

      audio.addEventListener("loadedmetadata", () => {
        DOM.duration.textContent = formatTime(audio.duration);
      });

      audio.addEventListener("timeupdate", () => {
        if (dragging) return;

        DOM.current.textContent = formatTime(audio.currentTime);

        if (audio.duration) {
          DOM.fill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        }
      });

      audio.addEventListener("play", updatePlayIcon);
      audio.addEventListener("pause", updatePlayIcon);

      audio.addEventListener("error", () => {
        console.error("Could not load audio:", TRACKS[currentIndex].file);
        updatePlayIcon();
      });

      audio.addEventListener("ended", () => {
        loadTrack(currentIndex + 1, true);
      });

      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;

        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        }

        if (e.code === "Escape") closeModal();
        if (e.code === "ArrowRight") loadTrack(currentIndex + 1, true);
        if (e.code === "ArrowLeft") loadTrack(currentIndex - 1, true);
      });

      DOM.video.src = BG.night;
      DOM.video.play().catch(() => {});

      loadTrack(0);
      renderTracks();
      updatePlayIcon();
    </script>
  </body>
</html>
